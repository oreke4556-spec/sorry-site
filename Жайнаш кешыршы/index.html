<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Прости меня ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">

        <div class="heart">❤️</div>

        <h1>Прости меня...</h1>

        <p>
            Я правда не хотел тебя обидеть.<br>
            Мне очень жаль 🥺<br><br>
            Ты меня простишь?
        </p>

        <div class="buttons">
            <button id="yes">Да ❤️</button>
            <button id="no">Нет 😢</button>
        </div>

        <div id="success" class="hidden">
            Я знал, что ты меня простишь 🥹❤️
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
